packages:
  - apps/*
  - packages/*

overrides:
  '@nestjs/platform-express@12.2.0>multer': 2.5.0
  # 仅修复OpenAPI构建解析器的YAML累计工作量漏洞，保留其他依赖分支
  '@hey-api/json-schema-ref-parser@1.4.4>js-yaml': 4.3.2

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

onlyBuiltDependencies:
  # 官方 node-argon2：仅运行已审查的 node-gyp-build 原生绑定安装入口。
  - argon2
  - '@nestjs/core'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - msgpackr-extract
