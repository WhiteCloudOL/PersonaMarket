name: 工程门禁
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: 源码与依赖
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/project-environment
      - name: 格式、类型、单元、契约和生产构建
        run: pnpm check && pnpm build
      - name: 核验依赖和源码安全
        run: pnpm deps:check && pnpm security:scan
      - name: 保留不含会话和测试正文的扫描摘要
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence
          path: |
            .development/evidence/security-scan.json
            .development/evidence/npm-audit.json
          include-hidden-files: true
          if-no-files-found: ignore

  integration:
    name: 真实集成
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/project-environment
        with:
          infrastructure: 'true'
      - run: pnpm test:integration

  browser:
    name: 浏览器 · ${{ matrix.viewport }}
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        viewport: [desktop, tablet, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/project-environment
        with:
          infrastructure: 'true'
          browsers: 'true'
      - run: pnpm test:e2e --project=${{ matrix.viewport }}

  visual:
    name: 视觉和触控
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/project-environment
        with:
          infrastructure: 'true'
          browsers: 'true'
      - run: pnpm test:visual

  containers:
    name: 容器与恢复
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/project-environment
        with:
          infrastructure: 'true'
          browsers: 'true'
      - name: 构建并扫描运行镜像
        run: pnpm build:images && pnpm security:images
      - name: 启动真实应用
        run: |
          docker compose --parallel 1 -f compose.yaml -f compose.dev.yaml up -d --wait
          curl --fail http://127.0.0.1:8080/api/v1/public/config
      - name: 受控 HTTPS 在线素材与 SSRF
        run: pnpm test:remote
      - name: 空目录、隔离恢复与持久化
        run: |
          docker compose --parallel 1 -f compose.yaml -f compose.dev.yaml stop
          trap 'docker compose --parallel 1 -f compose.yaml -f compose.dev.yaml up -d --wait' EXIT
          pnpm test:compose
          docker compose --parallel 1 -f compose.yaml -f compose.dev.yaml up -d --wait
          trap - EXIT
          pnpm test:recovery
          pnpm test:proxy
      - name: 官方平台原生消费
        run: pnpm test:native

  verify:
    if: always()
    needs: [source, integration, browser, visual, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总全部必要检查
        env:
          ALL_CHECKS_SUCCESS: ${{ needs.source.result == 'success' && needs.integration.result == 'success' && needs.browser.result == 'success' && needs.visual.result == 'success' && needs.containers.result == 'success' }}
        run: test "$ALL_CHECKS_SUCCESS" = 'true'
